[project]
name = "eagv3-session6-agent"
version = "1.0.0"
description = "Session 6 single-agent cognitive architecture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "mcp>=1.2",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
    "tavily-python>=0.5",
    "crawl4ai>=0.4",
    "pyyaml>=6.0",
]

[project.scripts]
agent6 = "agent6:main"
